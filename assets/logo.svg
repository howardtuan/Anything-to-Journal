<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Anything to Journal</title>
  <desc id="desc">Mixed research materials become a structured, traceable journal manuscript.</desc>
